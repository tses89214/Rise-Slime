# Two-node Kafka (KRaft, no ZooKeeper) + ClickHouse + Flink.
#   kafka  = broker + controller   kafka2 = broker only (demo: scaling out, replication)
# Listener labels: WEB_GAME = clients on your machine, DOCKER = other containers, CONTROLLER = cluster internal.
x-kafka-common: &kafka-common
  image: apache/kafka:3.8.0
  environment: &kafka-env
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk   # all nodes must share one id
    KAFKA_LOG_DIRS: /var/lib/kafka/data   # image default is /tmp, which a volume mount would not cover
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,WEB_GAME:PLAINTEXT,DOCKER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    KAFKA_DEFAULT_REPLICATION_FACTOR: 2   # topics auto-created by the collector get a copy on both nodes
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

services:
  kafka:
    <<: *kafka-common
    ports: ["9092:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: WEB_GAME://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: WEB_GAME://localhost:9092,DOCKER://kafka:29092

  kafka2:
    <<: *kafka-common
    ports: ["9094:9094"]
    volumes: ["kafka2-data:/var/lib/kafka/data"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker   # no controller: it asks node 1 for metadata
      KAFKA_LISTENERS: WEB_GAME://:9094,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: WEB_GAME://localhost:9094,DOCKER://kafka2:29092
    depends_on: [kafka]

  # browse topics/messages at http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,kafka2:29092
    depends_on: [kafka, kafka2]

  # SQL console: docker compose exec clickhouse clickhouse-client; HTTP :8123 for the dashboard
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"   # image default blocks the passwordless default user from outside the container; local dev only
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./pipeline/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # runs on first start only
    ulimits: {nofile: {soft: 262144, hard: 262144}}

  # Flink UI at http://localhost:8081. Job = pipeline/flink/job.sql, submitted by flink-sql below.
  flink-jobmanager:
    build: pipeline/flink
    command: jobmanager
    ports: ["8081:8081"]
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        execution.checkpointing.interval: 10 s
        state.checkpoints.dir: file:///opt/flink/state/checkpoints
        state.savepoints.dir: file:///opt/flink/state/savepoints
    volumes: [flink-state:/opt/flink/state]
    depends_on: [kafka, kafka2]

  flink-taskmanager:
    build: pipeline/flink
    command: taskmanager
    environment: *flink-env
    volumes: [flink-state:/opt/flink/state]
    depends_on: [flink-jobmanager]

  # one-shot: runs job.sql, leaves the streaming job running on the cluster, then exits. Re-run after editing job.sql.
  flink-sql:
    build: pipeline/flink
    profiles: ["submit"]
    command: sh -c '/opt/flink/bin/sql-client.sh $$SQL_ARGS -f /job/job.sql'   # SQL_ARGS: scripts/flink-restart.sh passes -Dexecution.savepoint.path=...
    environment:
      <<: *flink-env
      SQL_ARGS: ${SQL_ARGS:-}
    volumes: ["./pipeline/flink/job.sql:/job/job.sql:ro"]
    depends_on: [flink-jobmanager, flink-taskmanager]

volumes:
  clickhouse-data:
  flink-state:
  kafka-data:
  kafka2-data:
